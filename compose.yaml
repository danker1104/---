services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yaja_simja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - yaja_simja_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yaja_simja"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  yaja_simja_postgres:
